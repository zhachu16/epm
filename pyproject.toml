[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epm"
version = "0.1.0"
description = "Financial modelling engine with named metrics and formulas on pandas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.6",
    "pyarrow>=15",
    "typer>=0.12",
]

[project.scripts]
fm = "epm.cli:run_cli"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["epm"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
